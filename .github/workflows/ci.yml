name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run check
      - run: node scripts/preview.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: preview
          path: docs/preview/preview.html
